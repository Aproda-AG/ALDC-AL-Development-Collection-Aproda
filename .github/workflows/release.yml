name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing non-Aproda release tag to publish, for example v1.2.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag }}
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run validation
      run: npm run validate
      
    - name: Verify release tag
      id: get_version
      shell: bash
      run: |
        set -euo pipefail
        TAG="${{ inputs.tag }}"
        if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Tag must use v<major>.<minor>.<patch>; got $TAG." >&2
          exit 1
        fi
        if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
          echo "Tag $TAG does not exist." >&2
          exit 1
        fi
        echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"
        echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
        
    - name: Extract changelog for this version
      id: changelog
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        # Extract changelog section for this version
        sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d' > release-notes.md
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: Release ${{ steps.get_version.outputs.TAG }}
        body_path: release-notes.md
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          collections/al-development.collection.yml
          scripts/validate-al-collection.js
          package.json
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Update version badge
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        echo "Released version $VERSION"
