name: Aproda Layer Version

on:
  push:
    tags:
      - 'v*_aproda.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-layer-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged revision
        uses: actions/checkout@v4

      - name: Validate tag and layer version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ "$TAG" == "$VERSION" ]] || ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+_aproda\.[0-9]+$ ]]; then
            echo "Expected tag format v<core>_aproda.<revision>; got $TAG" >&2
            exit 1
          fi
          ACTUAL=$(sed -nE 's/^[[:space:]]*layerVersion:[[:space:]]*"?([^"#[:space:]]+).*/\1/p' aldc.yaml | head -n1)
          if [[ "$ACTUAL" != "$VERSION" ]]; then
            echo "Tag $TAG requires aldc.yaml aproda.layerVersion $VERSION; found ${ACTUAL:-<missing>}." >&2
            exit 1
          fi
          echo "Validated Aproda layer version $VERSION."
